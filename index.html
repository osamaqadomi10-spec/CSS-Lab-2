<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title> css task </title>

    <style>
        .float-section img {
            float: left;
            width: 200px;
            margin-right: 15px;
        }
        .flex-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 200px;
            border: 2px solid black;

        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            justify-content: center;
            border: 2px solid black;
            padding: 10px;
        }

        .grid-box {
            background-color: lightgreen;
            border: 2px solid green;
            display: flex;
            justify-content: center;
            align-items: center;
        }
            .grid-box:nth-child(1) {
                grid-row: 1;
                grid-column: 1;
            }

            .grid-box:nth-child(2) {
                grid-row: 2;
                grid-column: 2;
            }

            .grid-box:nth-child(3) {
                grid-row: 3;
                grid-column: 3;
            }

            .grid-box:nth-child(4) {
                grid-row: 4;
                grid-column: 4;
            }

        @media (max-width: 600px) {

            
            .float-section img {
                float: none;
                display: block;
                width: 100%;
                max-width: 300px;
                margin: 0 auto 15px;
            }

         
            .flex-container {
                flex-direction: column;
                height: auto;
                padding: 20px;
            }

            
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }

            .grid-box {
                height: 80px;
            }

                .grid-box:nth-child(n) {
                    grid-row: auto;
                    grid-column: auto;
                }
        }




    </style>

</head>
<body>
    <h1>CSS Lab 2</h1>

    <!-- Float Section -->
    <section class="float-section">
        <h2>Float Section</h2>
        <h3>My Beautiful House</h3>
        <img src="house.jpg" alt="My House">
        <p>
            This is an article about my house.
            It is a beautiful place with a garden
            and many rooms. I love spending time
            in my house with my family.
        </p>
    </section>
    <!-- flixbox-->
    <section class="flex-section">
        <h2>Flexbox Section</h2>
        <div class="flex-container">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
            <div class="box">Box 4</div>

        </div>

    </section>

    <!-- grid section -->
    <section class="grid-section">
        <h2>Grid Section</h2>

        <div class="grid-container">
            <div class="grid-box">box1</div>
            <div class="grid-box">box2</div>
            <div class="grid-box">box3</div>
            <div class="grid-box">box4</div>




        </div>






    </section>

















</body>
</html>
